name: Backend CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: devfolio_test
          POSTGRES_PASSWORD: isolated_ci_password
          POSTGRES_DB: devfolio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devfolio_test -d devfolio_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://devfolio_test:isolated_ci_password@127.0.0.1:5432/devfolio_test
      CONTACT_HASH_SECRET: isolated-ci-secret-of-sufficient-length
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check app alembic tests
      - run: ruff format --check app alembic tests
      - run: pytest -q
      - run: alembic upgrade head
      - run: alembic check
